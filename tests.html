<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тесты — Torgovchik</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/VWRmsGHt/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1C1715;
            --bg-card: #2A201D;
            --border: #49352C;
            --text: #F4E8D5;
            --muted: #9D887A;
            --accent: #D88932;
            --green: #7BA05B;
            --red: #B85C32;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 20px;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        h1 {
            font-family: 'Bitter', serif;
            font-size: 28px;
            margin-bottom: 24px;
            color: var(--text);
        }
        .summary {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            min-width: 130px;
        }
        .summary-card__label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .summary-card__value {
            font-family: 'Bitter', serif;
            font-size: 26px;
            font-weight: 700;
        }
        .summary-card--ok .summary-card__value { color: var(--green); }
        .summary-card--fail .summary-card__value { color: var(--red); }
        .test-group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .test-group__header {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-group__header::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }
        .test-group.collapsed .test-group__header::after {
            transform: rotate(-90deg);
        }
        .test-group.collapsed .test-group__body {
            display: none;
        }
        .test-group__body {
            padding: 6px 0;
        }
        .test-case {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 18px;
            font-size: 14px;
            border-bottom: 1px solid rgba(73, 53, 44, 0.35);
        }
        .test-case:last-child { border-bottom: none; }
        .test-case__icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin-top: 1px;
        }
        .test-case--pass .test-case__icon {
            background: rgba(123, 160, 91, 0.2);
            color: var(--green);
        }
        .test-case--fail .test-case__icon {
            background: rgba(184, 92, 50, 0.25);
            color: var(--red);
        }
        .test-case__name {
            flex: 1;
            line-height: 1.5;
        }
        .test-case__detail {
            color: var(--muted);
            font-size: 12.5px;
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-word;
        }
        .test-case__detail strong { color: var(--red); }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .btn {
            background: var(--accent);
            color: #1C1715;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Manrope', sans-serif;
            transition: filter 0.2s;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn--secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>🧪 Тесты Torgovchik</h1>

        <div class="controls">
            <button class="btn" onclick="runAll()">Перезапустить</button>
            <button class="btn btn--secondary" onclick="toggleAll()">Свернуть / Развернуть</button>
        </div>

        <div class="summary" id="summary">
            <div class="summary-card">
                <div class="summary-card__label">Всего</div>
                <div class="summary-card__value" id="totalCount">0</div>
            </div>
            <div class="summary-card summary-card--ok">
                <div class="summary-card__label">Прошло</div>
                <div class="summary-card__value" id="passCount">0</div>
            </div>
            <div class="summary-card summary-card--fail">
                <div class="summary-card__label">Провалилось</div>
                <div class="summary-card__value" id="failCount">0</div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        const resultsEl = document.getElementById('results');
        let totalCount = 0;
        let passCount = 0;
        let failCount = 0;

        function assert(condition, message) {
            return {
                pass: !!condition,
                message: message || ''
            };
        }

        function deepEqual(a, b) {
            return JSON.stringify(a) === JSON.stringify(b);
        }

        function runGroup(name, tests) {
            const group = document.createElement('div');
            group.className = 'test-group';

            const header = document.createElement('div');
            header.className = 'test-group__header';
            header.textContent = name;
            header.addEventListener('click', () => {
                group.classList.toggle('collapsed');
            });
            group.appendChild(header);

            const body = document.createElement('div');
            body.className = 'test-group__body';

            tests.forEach(t => {
                const result = t.fn();
                totalCount++;
                if (result.pass) passCount++;
                else failCount++;

                const item = document.createElement('div');
                item.className = 'test-case ' + (result.pass ? 'test-case--pass' : 'test-case--fail');

                const icon = document.createElement('div');
                icon.className = 'test-case__icon';
                icon.textContent = result.pass ? '✓' : '✕';

                const nameEl = document.createElement('div');
                nameEl.className = 'test-case__name';
                nameEl.textContent = t.name;

                if (!result.pass && result.message) {
                    const detail = document.createElement('div');
                    detail.className = 'test-case__detail';
                    detail.innerHTML = '<strong>Ожидалось:</strong> ' + result.message;
                    nameEl.appendChild(detail);
                }

                item.appendChild(icon);
                item.appendChild(nameEl);
                body.appendChild(item);
            });

            group.appendChild(body);
            resultsEl.appendChild(group);
        }

        function runAll() {
            resultsEl.innerHTML = '';
            totalCount = 0;
            passCount = 0;
            failCount = 0;

            const U = window.Utils;

            // =========================================
            // validateTelegramUsername
            // =========================================
            runGroup('validateTelegramUsername — валидные', [
                { name: 'username без @ (5 символов)', fn: () => assert(U.validateTelegramUsername('abcde') === null, 'null') },
                { name: 'username с @', fn: () => assert(U.validateTelegramUsername('@abcde') === null, 'null') },
                { name: 'длинный 32 символа', fn: () => assert(U.validateTelegramUsername('a'.repeat(32)) === null, 'null') },
                { name: 'с подчёркиваниями внутри', fn: () => assert(U.validateTelegramUsername('user_name') === null, 'null') },
                { name: 'с цифрами', fn: () => assert(U.validateTelegramUsername('user123') === null, 'null') },
                { name: 'пробелы по краям', fn: () => assert(U.validateTelegramUsername('  abcde  ') === null, 'null') },
            ]);

            runGroup('validateTelegramUsername — невалидные', [
                { name: 'пустая строка', fn: () => assert(U.validateTelegramUsername('') !== null, 'ошибка') },
                { name: 'только @', fn: () => assert(U.validateTelegramUsername('@') !== null, 'ошибка') },
                { name: 'короче 5 символов', fn: () => assert(U.validateTelegramUsername('abc') !== null, 'ошибка') },
                { name: 'длиннее 32 символов', fn: () => assert(U.validateTelegramUsername('a'.repeat(33)) !== null, 'ошибка') },
                { name: 'начинается с цифры', fn: () => assert(U.validateTelegramUsername('1abcde') !== null, 'ошибка') },
                { name: 'начинается с _', fn: () => assert(U.validateTelegramUsername('_abcde') !== null, 'ошибка') },
                { name: 'заканчивается на _', fn: () => assert(U.validateTelegramUsername('abcde_') !== null, 'ошибка') },
                { name: 'двойное __', fn: () => assert(U.validateTelegramUsername('ab__cd') !== null, 'ошибка') },
                { name: 'кириллица', fn: () => assert(U.validateTelegramUsername('юзер') !== null, 'ошибка') },
                { name: 'пробел внутри', fn: () => assert(U.validateTelegramUsername('ab cde') !== null, 'ошибка') },
                { name: 'спецсимволы', fn: () => assert(U.validateTelegramUsername('ab-cde') !== null, 'ошибка') },
                { name: 'не строка (число)', fn: () => assert(U.validateTelegramUsername(12345) !== null, 'ошибка') },
                { name: 'не строка (null)', fn: () => assert(U.validateTelegramUsername(null) !== null, 'ошибка') },
            ]);

            // =========================================
            // normalizeTelegramUsername
            // =========================================
            runGroup('normalizeTelegramUsername', [
                { name: 'с @ — убирает @', fn: () => assert(U.normalizeTelegramUsername('@abcde') === 'abcde', 'abcde') },
                { name: 'без @ — не трогает', fn: () => assert(U.normalizeTelegramUsername('abcde') === 'abcde', 'abcde') },
                { name: 'пробелы по краям', fn: () => assert(U.normalizeTelegramUsername('  @abcde  ') === 'abcde', 'abcde') },
                { name: 'пустая строка', fn: () => assert(U.normalizeTelegramUsername('') === '', 'пустая') },
                { name: 'null — пустая строка', fn: () => assert(U.normalizeTelegramUsername(null) === '', 'пустая') },
                { name: 'undefined — пустая строка', fn: () => assert(U.normalizeTelegramUsername(undefined) === '', 'пустая') },
            ]);

            // =========================================
            // generateUUID / isValidUUID
            // =========================================
            runGroup('generateUUID + isValidUUID', [
                { name: 'UUID валидного формата', fn: () => assert(U.isValidUUID(U.generateUUID()), 'true') },
                { name: 'два UUID не равны', fn: () => assert(U.generateUUID() !== U.generateUUID(), 'разные') },
                { name: 'isValidUUID на мусоре', fn: () => assert(U.isValidUUID('not-a-uuid') === false, 'false') },
                { name: 'isValidUUID на пустой строке', fn: () => assert(U.isValidUUID('') === false, 'false') },
            ]);

            // =========================================
            // roundPrice
            // =========================================
            runGroup('roundPrice', [
                { name: '1.005 → 1.01 (округление вверх)', fn: () => assert(U.roundPrice(1.005) === 1.01, '1.01') },
                { name: '1.004 → 1', fn: () => assert(U.roundPrice(1.004) === 1, '1') },
                { name: '15 → 15', fn: () => assert(U.roundPrice(15) === 15, '15') },
                { name: '15.999 → 16', fn: () => assert(U.roundPrice(15.999) === 16, '16') },
                { name: 'NaN → 0', fn: () => assert(U.roundPrice(NaN) === 0, '0') },
                { name: 'строка "15" → 15', fn: () => assert(U.roundPrice('15') === 15, '15') },
            ]);

            // =========================================
            // calculateCartTotal
            // =========================================
            runGroup('calculateCartTotal', [
                {
                    name: 'пустая корзина → 0',
                    fn: () => assert(U.calculateCartTotal([], 0) === 0, '0')
                },
                {
                    name: 'один товар 15 × 1 = 15',
                    fn: () => assert(U.calculateCartTotal([{ price: 15, quantity: 1 }], 0) === 15, '15')
                },
                {
                    name: 'два товара 15×2 + 17×1 = 47',
                    fn: () => assert(U.calculateCartTotal([{ price: 15, quantity: 2 }, { price: 17, quantity: 1 }], 0) === 47, '47')
                },
                {
                    name: 'скидка 10% на 100 = 90',
                    fn: () => assert(U.calculateCartTotal([{ price: 50, quantity: 2 }], 10) === 90, '90')
                },
                {
                    name: 'скидка 50% на 15 = 7.5',
                    fn: () => assert(U.calculateCartTotal([{ price: 15, quantity: 1 }], 50) === 7.5, '7.5')
                },
                {
                    name: 'скидка 0 = без скидки',
                    fn: () => assert(U.calculateCartTotal([{ price: 15, quantity: 1 }], 0) === 15, '15')
                },
                {
                    name: 'дробные цены 10.99 × 2 = 21.98',
                    fn: () => assert(U.calculateCartTotal([{ price: 10.99, quantity: 2 }], 0) === 21.98, '21.98')
                },
                {
                    name: 'скидка 33% на 100 = 67',
                    fn: () => assert(U.calculateCartTotal([{ price: 100, quantity: 1 }], 33) === 67, '67')
                },
                {
                    name: 'невалидный items (null) → 0',
                    fn: () => assert(U.calculateCartTotal(null, 10) === 0, '0')
                },
                {
                    name: 'quantity как строка',
                    fn: () => assert(U.calculateCartTotal([{ price: 15, quantity: '2' }], 0) === 30, '30')
                },
            ]);

            // =========================================
            // countCartItems
            // =========================================
            runGroup('countCartItems', [
                { name: 'пустая корзина → 0', fn: () => assert(U.countCartItems([]) === 0, '0') },
                { name: 'один товар × 3 → 3', fn: () => assert(U.countCartItems([{ quantity: 3 }]) === 3, '3') },
                { name: 'разные количества → 6', fn: () => assert(U.countCartItems([{ quantity: 2 }, { quantity: 4 }]) === 6, '6') },
                { name: 'null → 0', fn: () => assert(U.countCartItems(null) === 0, '0') },
            ]);

            // =========================================
            // isFavorite / toggleFavoriteInList
            // =========================================
            runGroup('isFavorite + toggleFavoriteInList', [
                {
                    name: 'isFavorite: товар есть',
                    fn: () => assert(U.isFavorite([1, 2, 3], 2) === true, 'true')
                },
                {
                    name: 'isFavorite: товара нет',
                    fn: () => assert(U.isFavorite([1, 2, 3], 5) === false, 'false')
                },
                {
                    name: 'isFavorite: пустой массив',
                    fn: () => assert(U.isFavorite([], 1) === false, 'false')
                },
                {
                    name: 'isFavorite: не массив',
                    fn: () => assert(U.isFavorite(null, 1) === false, 'false')
                },
                {
                    name: 'toggle: добавление',
                    fn: () => {
                        const res = U.toggleFavoriteInList([], 5);
                        return assert(deepEqual(res.list, [5]) && res.added === true, '[5] + added');
                    }
                },
                {
                    name: 'toggle: удаление',
                    fn: () => {
                        const res = U.toggleFavoriteInList([1, 5, 10], 5);
                        return assert(deepEqual(res.list, [1, 10]) && res.added === false, '[1,10] + not added');
                    }
                },
                {
                    name: 'toggle: не мутирует исходный массив',
                    fn: () => {
                        const orig = [1, 2];
                        U.toggleFavoriteInList(orig, 3);
                        return assert(deepEqual(orig, [1, 2]), '[1,2] без изменений');
                    }
                },
                {
                    name: 'toggle: null → [id]',
                    fn: () => {
                        const res = U.toggleFavoriteInList(null, 7);
                        return assert(deepEqual(res.list, [7]) && res.added === true, '[7] + added');
                    }
                },
            ]);

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('passCount').textContent = passCount;
            document.getElementById('failCount').textContent = failCount;
        }

        function toggleAll() {
            document.querySelectorAll('.test-group').forEach(g => g.classList.toggle('collapsed'));
        }

        runAll();
    </script>
</body>
</html>
